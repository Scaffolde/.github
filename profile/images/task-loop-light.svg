<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="t d">
<title id="t">How a Scaffolde task runs</title>
<desc id="d">Five steps: the goal is kept word for word; done is written as falsifiable claims with checks; agents build across AI tools; a finish-time check on Claude Code blocks unproven deploy, user-flow and appearance claims; evidence and learnings return to the shared source for reuse.</desc>
